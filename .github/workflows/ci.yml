name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt
            requirements-eval.txt
            requirements-services.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-eval.txt
          python -m pip install -r requirements-services.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Guard API boundary
        run: |
          if grep -R --include='*.py' -nE '^\s*(import torch|from torch(\.|\s))' services/api; then
            echo 'services/api must not import torch; inference belongs in services/inference.' >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
