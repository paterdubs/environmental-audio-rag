# PostgreSQL 16 + pgvector cho event store (ADR-0005) — không cài PostgreSQL native trên
# Windows: pgvector native đòi biên dịch C extension theo đúng bản build Postgres (H3).
#
#   docker compose up -d                        # chỉ db (như trước)
#   docker compose --profile app up -d --build  # db + inference + api (kèm frontend), W7 7.4
#
# Inference chạy trong container từ 27/09 (ADR-0033), CPU only — GPU trong container trên
# Windows cần WSL2 + nvidia-container-toolkit cấu hình thêm trên host, ngoài phạm vi demo này.
# Checkpoint/BGE-M3 không đóng vào image (đĩa gần đầy, weight đổi độc lập với code) — mount
# ml/runs/ và artifacts/hf/ chỉ đọc. Vẫn chạy trên host được nếu muốn dùng GPU thật:
#   .venv/Scripts/python.exe -m uvicorn services.inference.app.main:app --host 0.0.0.0 --port 8001
#   (rồi trỏ INFERENCE_URL của api sang http://host.docker.internal:8001, bỏ service inference)
# Giao diện: http://localhost:8088  (8000 trên máy dev đã có ứng dụng khác)
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: environmental_audio
    ports:
      - "5432:5432"
    volumes:
      - environmental_audio_db:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d environmental_audio"]
      interval: 5s
      timeout: 5s
      retries: 10

  inference:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    volumes:
      - ./ml/runs:/app/ml/runs:ro
      - ./artifacts/hf:/app/artifacts/hf:ro
      - ./data/raw/datased/extracted:/app/data/raw/datased/extracted:ro
      - ./data/features/datased/logmel_panns_v1:/app/data/features/datased/logmel_panns_v1:ro
      - ./data/cache/datased_wav16k:/app/data/cache/datased_wav16k:ro
      - ./data/manifests:/app/data/manifests:ro
      - ./data/splits:/app/data/splits:ro
      - ./data/annotations:/app/data/annotations:ro
      - ./scripts:/app/scripts:ro
      - ./docs/measurements:/app/docs/measurements
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/environmental_audio
      INFERENCE_URL: http://inference:8001
      EARAG_LLM_ENDPOINT: http://host.docker.internal:8081
      UPLOAD_DIR: /app/data/uploads
      FRONTEND_DIST: /app/services/frontend/dist
    ports:
      - "8088:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/raw/datased/extracted:/app/data/raw/datased/extracted:ro

volumes:
  environmental_audio_db:
